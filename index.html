<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas compartido</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="loginFormWrapper" class="panel">
        <form id="loginForm">
            <h2>Iniciar sesión</h2>
            <label for="name">Nombre</label>
            <input id="name" type="text" placeholder="Ej: Paco" required>
            <button type="submit">Entrar</button>
        </form>
    </div>

    <div id="canvasSection" class="hidden">
        <h2>Canvas compartido</h2>
        <p>Bienvenido, <span id="userName"></span></p>
        <canvas id="myCanvas" width="800" height="600"></canvas>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const loginForm = document.getElementById('loginForm');
        const loginFormWrapper = document.getElementById('loginFormWrapper');
        const canvasSection = document.getElementById('canvasSection');
        const userName = document.getElementById('userName');
        const canvas = document.getElementById('myCanvas');
        const ctx = canvas.getContext('2d');
        const socket = io();

        const remoteUsers = new Map();
        const localUser = {
            name: '',
            x: 0,
            y: 0,
            drawing: false,
            currentStroke: [],
            strokes: []
        };

        function showCanvas() {
            loginFormWrapper.classList.add('hidden');
            canvasSection.classList.remove('hidden');
        }

        function getCanvasCoordinates(event) {
            const rect = canvas.getBoundingClientRect();
            const x = ((event.clientX - rect.left) / rect.width) * canvas.width;
            const y = ((event.clientY - rect.top) / rect.height) * canvas.height;
            return { x, y };
        }

        function drawCursor(x, y, color, label) {
            ctx.beginPath();
            ctx.arc(x, y, 8, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();

            ctx.fillStyle = '#111';
            ctx.font = '12px sans-serif';
            ctx.fillText(label, x + 12, y - 12);
        }

        function drawLine(points, color = '#ffffff') {
            if (points.length < 2) return;

            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);

            for (let i = 1; i < points.length; i++) {
                ctx.lineTo(points[i].x, points[i].y);
            }

            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();
        }

        function finishStroke() {
            if (localUser.currentStroke.length < 2) {
                localUser.currentStroke = [];
                return;
            }

            const stroke = [...localUser.currentStroke];
            localUser.strokes.push(stroke);
            socket.emit('drawing', stroke);
            localUser.currentStroke = [];
        }

        function renderCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#2f6f43';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            remoteUsers.forEach((user) => {
                user.strokes.forEach((stroke) => drawLine(stroke, '#ffffff'));
                drawCursor(user.x, user.y, '#ff4d4d', user.name);
            });

            localUser.strokes.forEach((stroke) => drawLine(stroke, '#ffffff'));

            if (localUser.currentStroke.length > 0) {
                drawLine(localUser.currentStroke, '#ffffff');
            }

            if (localUser.name) {
                drawCursor(localUser.x, localUser.y, '#ffffff', localUser.name);
            }
        }

        function animate() {
            renderCanvas();
            requestAnimationFrame(animate);
        }

        loginForm.addEventListener('submit', (event) => {
            event.preventDefault();

            const name = document.getElementById('name').value.trim();
            if (!name) {
                alert('Escribe tu nombre para continuar.');
                return;
            }

            localUser.name = name;
            userName.textContent = name;
            showCanvas();
            socket.emit('register-user', { name });
        });

        socket.on('users-list', (users) => {
            users.forEach((user) => {
                if (user.id !== socket.id) {
                    remoteUsers.set(user.id, {
                        ...user,
                        strokes: []
                    });
                }
            });
        });

        socket.on('user-connected', (user) => {
            remoteUsers.set(user.id, {
                ...user,
                strokes: []
            });
        });

        socket.on('user-disconnected', ({ id }) => {
            remoteUsers.delete(id);
        });

        socket.on('cursor-move', ({ id, x, y }) => {
            const user = remoteUsers.get(id);
            if (!user) {
                remoteUsers.set(id, { id, name: 'Usuario', x, y, strokes: [] });
                return;
            }

            user.x = x;
            user.y = y;
        });

        socket.on('drawing', ({ id, stroke }) => {
            const user = remoteUsers.get(id);
            if (!user) {
                remoteUsers.set(id, { id, name: 'Usuario', x: 0, y: 0, strokes: [stroke] });
                return;
            }

            user.strokes.push(stroke);
        });

        canvas.addEventListener('mousedown', (event) => {
            const { x, y } = getCanvasCoordinates(event);
            localUser.drawing = true;
            localUser.x = x;
            localUser.y = y;
            localUser.currentStroke = [{ x, y }];
        });

        canvas.addEventListener('mousemove', (event) => {
            const { x, y } = getCanvasCoordinates(event);
            localUser.x = x;
            localUser.y = y;

            if (localUser.drawing) {
                localUser.currentStroke.push({ x, y });
            }

            socket.emit('cursor-move', { x, y });
        });

        canvas.addEventListener('mouseup', () => {
            if (localUser.drawing) {
                finishStroke();
                localUser.drawing = false;
            }
        });

        canvas.addEventListener('mouseleave', () => {
            if (localUser.drawing) {
                finishStroke();
                localUser.drawing = false;
            }
        });

        requestAnimationFrame(animate);
    </script>
</body>

</html>
