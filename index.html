<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Canvas</title>
    <link rel='stylesheet' href='style.css'>
</head>

<body>
    <div class="formulari" id="loginFormWrapper">
        <form id="loginForm">
            <h2>Iniciar Sessió</h2>
            <label for="name">Nom:</label>
            <input type="text" id="name" name="name" placeholder="Ex: Paco" required>
            <br><br>
            <button type="submit">Iniciar</button><br><br>
        </form>
    </div>

    <div class="canvas" id="canvasSection">
        <h2>Canvas</h2>
        <p>Benvingut, <span id="userName"></span>!</p>
        <canvas id="myCanvas" width="800" height="600"
            style="border:1px solid #000000; background-color: #337c3c;"></canvas>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const loginForm = document.getElementById('loginForm');
        const loginFormWrapper = document.getElementById('loginFormWrapper');
        const canvasSection = document.getElementById('canvasSection');
        const userName = document.getElementById('userName');
        const canvas = document.getElementById('myCanvas');
        const ctx = canvas.getContext('2d');
        const socket = io();
        const remoteUsers = new Map();
        const localUser = {
            name: '',
            x: 0,
            y: 0,
            drawing: false,
            currentStroke: [],
            strokes: []
        };

        loginForm.addEventListener('submit', (event) => {
            event.preventDefault();

            const name = document.getElementById('name').value.trim();

            if (!name) {
                alert('Escriu el teu nom per continuar.');
                return;
            }

            localUser.name = name;
            userName.textContent = name;
            loginFormWrapper.style.display = 'none';
            canvasSection.style.display = 'block';
            socket.emit('register-user', { name });
        });

        function getCanvasCoordinates(event) {
            const rect = canvas.getBoundingClientRect();
            const x = ((event.clientX - rect.left) / rect.width) * canvas.width;
            const y = ((event.clientY - rect.top) / rect.height) * canvas.height;
            return { x, y };
        }

        function drawCursor(x, y, color = '#ff0000', label = 'Usuari') {
            ctx.beginPath();
            ctx.arc(x, y, 8, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();

            ctx.fillStyle = '#000';
            ctx.font = '12px sans-serif';
            ctx.fillText(label, x + 12, y - 12);
        }

        function drawLine(points, color = '#ffffff') {
            if (points.length < 2) {
                return;
            }

            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);

            for (let i = 1; i < points.length; i++) {
                ctx.lineTo(points[i].x, points[i].y);
            }

            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();
        }

        function commitCurrentStroke() {
            if (localUser.currentStroke.length > 0) {
                localUser.strokes.push([...localUser.currentStroke]);
                localUser.currentStroke = [];
            }
        }

        function renderCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#337c3c';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            remoteUsers.forEach((user) => {
                drawCursor(user.x, user.y, '#ff0000', user.name);
            });

            localUser.strokes.forEach((stroke) => {
                drawLine(stroke, '#ffffff');
            });

            if (localUser.currentStroke.length > 0) {
                drawLine(localUser.currentStroke, '#ffffff');
            }

            if (localUser.name) {
                drawCursor(localUser.x, localUser.y, '#ffffff', localUser.name);
            }
        }

        function animate() {
            renderCanvas();
            requestAnimationFrame(animate);
        }

        socket.on('users-list', (users) => {
            users.forEach((user) => {
                remoteUsers.set(user.id, user);
            });
        });

        socket.on('user-connected', (user) => {
            remoteUsers.set(user.id, user);
        });

        socket.on('user-disconnected', ({ id }) => {
            remoteUsers.delete(id);
        });

        socket.on('cursor-move', ({ id, x, y }) => {
            const user = remoteUsers.get(id);
            if (!user) {
                remoteUsers.set(id, { id, name: 'Usuari', x, y });
            } else {
                user.x = x;
                user.y = y;
            }
        });

        canvas.addEventListener('mousedown', (event) => {
            const { x, y } = getCanvasCoordinates(event);
            commitCurrentStroke();
            localUser.drawing = true;
            localUser.x = x;
            localUser.y = y;
            localUser.currentStroke.push({ x, y });
        });

        canvas.addEventListener('mousemove', (event) => {
            const { x, y } = getCanvasCoordinates(event);
            localUser.x = x;
            localUser.y = y;

            if (localUser.drawing) {
                localUser.currentStroke.push({ x, y });
            }

            socket.emit('cursor-move', { x, y });
        });

        canvas.addEventListener('mouseup', () => {
            if (localUser.drawing) {
                commitCurrentStroke();
                localUser.drawing = false;
            }
        });

        canvas.addEventListener('mouseleave', () => {
            if (localUser.drawing) {
                commitCurrentStroke();
                localUser.drawing = false;
            }
        });

        requestAnimationFrame(animate);
    </script>
</body>

</html>
